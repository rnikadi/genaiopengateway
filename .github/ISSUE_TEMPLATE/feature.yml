name: Feature request
description: Something the gateway should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What you are trying to do and what stops you today.}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposal, description: How you would like it to work. Larger changes need an ADR (CONTRIBUTING.md).}
