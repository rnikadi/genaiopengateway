name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gog_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
    env:
      GOG_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/gog_test?sslmode=disable
      GOG_TEST_VALKEY_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test -race ./...
      - run: go build ./cmd/gateway

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build for every release platform
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: Binaries build for every platform
        run: scripts/build-binaries.sh ci

  e2e:
    # The Docker Compose setup with Dex, driven by a browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the Compose setup with sign-in
        working-directory: deploy/compose
        run: |
          docker compose -f compose.yaml -f compose.sso.yaml up -d --build --wait --wait-timeout 300
          timeout 60 sh -c 'until curl -sf localhost:8080/readyz && curl -sf localhost:5556/dex/.well-known/openid-configuration >/dev/null; do sleep 1; done'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Admin UI browser test
        working-directory: test/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node admin-ui.mjs
      - name: Logs
        if: failure()
        working-directory: deploy/compose
        run: docker compose -f compose.yaml -f compose.sso.yaml logs
