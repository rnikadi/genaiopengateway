name: release

# Runs on a pushed vX.Y.Z tag, or from the Actions tab with a version,
# in which case it tags the head of main first.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.1.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - name: Check the version has notes
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad version $TAG"; exit 1; }
          scripts/release-notes.sh "${TAG#v}" >/dev/null
      - name: Tag main
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "GenAIOpenGateway $TAG"
          git push origin "$TAG"

  binaries:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # keyless signing
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
      - name: Release notes
        run: scripts/release-notes.sh "${TAG#v}" > notes.md
      - name: Build
        run: scripts/build-binaries.sh "${TAG#v}"
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/genaiopengateway_${{ env.TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: |
          cd dist
          for f in checksums.txt *.spdx.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file notes.md $prerelease dist/*

  image:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
          flavor: latest=false
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

  chart:
    # After the image, so the chart never points at a missing tag.
    needs: [tag, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: sigstore/cosign-installer@v3
      - name: Package, push and sign
        run: |
          version="${TAG#v}"
          helm package deploy/helm/genaiopengateway --version "$version" --app-version "$version" -d dist
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/genaiopengateway-$version.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest: //p' push.log)
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/genaiopengateway@$digest"
