# A stored configuration object of the gateway (a provider, model,
# guardrail, MCP server, virtual MCP server, A2A agent, alert webhook or
# stream), reconciled by the operator (docs/operator.md). Secrets come
# from Kubernetes Secrets through secretRefs.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gatewayconfigobjects.genaiopengateway.io
spec:
  group: genaiopengateway.io
  scope: Namespaced
  names:
    plural: gatewayconfigobjects
    singular: gatewayconfigobject
    kind: GatewayConfigObject
    shortNames: [gcfg]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Kind, type: string, jsonPath: .spec.kind}
        - {name: Ready, type: string, jsonPath: ".status.conditions[?(@.type==\"Ready\")].status"}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [providers, models, guardrails, mcp_servers, mcp_virtual_servers, a2a_agents, alert_webhooks, streams]
                name: {type: string, description: "The object's name in the gateway; default: the resource's name."}
                spec:
                  type: object
                  description: The object as in the config file (docs/config.md).
                  x-kubernetes-preserve-unknown-fields: true
                secretRefs:
                  type: array
                  description: Values read from Secrets in this namespace and set in spec, such as api_key or headers.Authorization.
                  items:
                    type: object
                    required: [path, secretKeyRef]
                    properties:
                      path: {type: string}
                      secretKeyRef:
                        type: object
                        required: [name, key]
                        properties:
                          name: {type: string}
                          key: {type: string}
            status:
              type: object
              properties:
                observedGeneration: {type: integer}
                appliedHash: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
