apiVersion: v1
kind: Service
metadata:
  name: {{ include "gog.fullname" . }}
  labels:
    {{- include "gog.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "gog.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.metricsPort }}
    - name: metrics
      port: {{ .Values.metricsPort }}
      targetPort: metrics
    {{- end }}
