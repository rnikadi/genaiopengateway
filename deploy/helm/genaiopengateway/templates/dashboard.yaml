{{- if .Values.grafanaDashboard.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gog.fullname" . }}-dashboard
  labels:
    {{- include "gog.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  genaiopengateway.json: |-
    {{- .Files.Get "files/dashboard.json" | nindent 4 }}
{{- end }}
