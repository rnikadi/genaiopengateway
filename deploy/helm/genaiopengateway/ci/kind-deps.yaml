# Postgres, Valkey and a fake OpenAI-compatible provider for the kind
# smoke test. Not for production: see docs/deploy-kubernetes.md.
apiVersion: v1
kind: Secret
metadata: {name: genaiopengateway}
stringData:
  GATEWAY_ADMIN_TOKEN: ci-admin-token-0000000000000000000000
  GATEWAY_DEV_KEY: ci-dev-key-0000000000
  DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway?sslmode=disable
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres}
spec:
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_USER, value: gateway}
            - {name: POSTGRES_PASSWORD, value: gateway}
            - {name: POSTGRES_DB, value: gateway}
          readinessProbe:
            exec: {command: [pg_isready, -U, gateway, -d, gateway]}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: valkey}
spec:
  selector: {matchLabels: {app: valkey}}
  template:
    metadata: {labels: {app: valkey}}
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.1-alpine
          readinessProbe:
            exec: {command: [valkey-cli, ping]}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: {name: valkey}
spec:
  selector: {app: valkey}
  ports: [{port: 6379}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: fake-provider}
data:
  default.conf: |
    server {
      listen 8080;
      default_type application/json;
      location = /v1/chat/completions {
        return 200 '{"id":"chatcmpl-ci","object":"chat.completion","created":1,"model":"fake-model","choices":[{"index":0,"message":{"role":"assistant","content":"hello from kind"},"finish_reason":"stop"}],"usage":{"prompt_tokens":5,"completion_tokens":3,"total_tokens":8}}';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fake-provider}
spec:
  selector: {matchLabels: {app: fake-provider}}
  template:
    metadata: {labels: {app: fake-provider}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - name: conf
          configMap: {name: fake-provider}
---
apiVersion: v1
kind: Service
metadata: {name: fake-provider}
spec:
  selector: {app: fake-provider}
  ports: [{port: 80, targetPort: 8080}]
