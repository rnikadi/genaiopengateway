# Gateway config for the SDK conformance run (run.sh). Not named
# config.yaml, which .gitignore keeps out for local configs.
listen: "127.0.0.1:18190"
admin: {token: conformance-admin-token-0000000000}
store: {driver: sqlite, dsn: "file:${CONFORMANCE_DB}"}
providers:
  up: {base_url: "http://127.0.0.1:18191/v1", api_key: upstream-key}
models:
  chat: {targets: [{provider: up, model: up-chat, price: {input_per_mtok: 1, output_per_mtok: 2}}]}
  embed: {targets: [{provider: up, model: up-embed}]}
  image: {targets: [{provider: up, model: gpt-image-1, price: {per_image: 0.04}}]}
  speech: {targets: [{provider: up, model: tts-1, price: {per_mchars: 15}}]}
  transcribe: {targets: [{provider: up, model: whisper-1, price: {per_audio_minute: 0.006}}]}
  moderate: {targets: [{provider: up, model: omni-moderation-latest}]}
  rerank: {targets: [{provider: up, model: rerank-v3.5, price: {per_request: 0.002}}]}
  video: {targets: [{provider: up, model: sora-2, price: {per_video_second: 0.1}}]}
keys:
  - {name: conformance, key: conformance-key-0000000000}
