# Provider presets and model prices (docs/catalog.md). Prices are USD from
# each provider's public price list when this catalog version was written;
# they change, so check the provider's page before relying on cost reports,
# and override any price per target in the config or the admin UI.
#
# kind is the endpoint a model serves: chat, embeddings, image, speech,
# transcription, moderation, rerank, video or realtime.
version: "2026-11-11"
providers:
  - id: openai
    name: OpenAI
    type: openai
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    key_url: https://platform.openai.com/api-keys
    pricing_url: https://openai.com/api/pricing/
    models:
      - {id: gpt-5, kind: chat, price: {input_per_mtok: 1.25, cached_input_per_mtok: 0.125, output_per_mtok: 10, batch_discount: 0.5}}
      - {id: gpt-5-mini, kind: chat, price: {input_per_mtok: 0.25, cached_input_per_mtok: 0.025, output_per_mtok: 2, batch_discount: 0.5}}
      - {id: gpt-5-nano, kind: chat, price: {input_per_mtok: 0.05, cached_input_per_mtok: 0.005, output_per_mtok: 0.4, batch_discount: 0.5}}
      - {id: gpt-4.1, kind: chat, price: {input_per_mtok: 2, cached_input_per_mtok: 0.5, output_per_mtok: 8, batch_discount: 0.5}}
      - {id: gpt-4.1-mini, kind: chat, price: {input_per_mtok: 0.4, cached_input_per_mtok: 0.1, output_per_mtok: 1.6, batch_discount: 0.5}}
      - {id: gpt-4o-mini, kind: chat, price: {input_per_mtok: 0.15, cached_input_per_mtok: 0.075, output_per_mtok: 0.6, batch_discount: 0.5}}
      - {id: text-embedding-3-small, kind: embeddings, price: {input_per_mtok: 0.02, batch_discount: 0.5}}
      - {id: text-embedding-3-large, kind: embeddings, price: {input_per_mtok: 0.13, batch_discount: 0.5}}
      - {id: gpt-image-1, kind: image, price: {per_image: 0.042}}
      - {id: tts-1, kind: speech, price: {per_mchars: 15}}
      - {id: tts-1-hd, kind: speech, price: {per_mchars: 30}}
      - {id: whisper-1, kind: transcription, price: {per_audio_minute: 0.006}}
      - {id: omni-moderation-latest, kind: moderation}
      - {id: gpt-realtime, kind: realtime, price: {input_per_mtok: 4, output_per_mtok: 16, audio_input_per_mtok: 32, audio_output_per_mtok: 64}}
      - {id: sora-2, kind: video, price: {per_video_second: 0.1}}
  - id: anthropic
    name: Anthropic
    type: anthropic
    base_url: https://api.anthropic.com
    key_env: ANTHROPIC_API_KEY
    key_url: https://console.anthropic.com/settings/keys
    pricing_url: https://www.anthropic.com/pricing#api
    models:
      - {id: claude-opus-5-5, kind: chat, price: {input_per_mtok: 4, cached_input_per_mtok: 0.2, output_per_mtok: 20, batch_discount: 0.5}}
      - {id: claude-sonnet-5-5, kind: chat, price: {input_per_mtok: 2, cached_input_per_mtok: 0.1, output_per_mtok: 10, batch_discount: 0.5}}
      - {id: claude-haiku-5-5, kind: chat, price: {input_per_mtok: 0.1, output_per_mtok: 0.5, batch_discount: 0.5}}
      - {id: claude-fable-5-2, kind: chat, price: {input_per_mtok: 8, cached_input_per_mtok: 0.2, output_per_mtok: 40, batch_discount: 0.5}}
      - {id: claude-opus-4-8, kind: chat, price: {input_per_mtok: 5, output_per_mtok: 25, batch_discount: 0.5}}
      - {id: claude-sonnet-4-6, kind: chat, price: {input_per_mtok: 3, output_per_mtok: 15, batch_discount: 0.5}}
      - {id: claude-haiku-4-5, kind: chat, price: {input_per_mtok: 1, output_per_mtok: 5, batch_discount: 0.5}}
  - id: gemini
    name: Google Gemini API
    type: gemini
    base_url: https://generativelanguage.googleapis.com
    key_env: GEMINI_API_KEY
    key_url: https://aistudio.google.com/apikey
    pricing_url: https://ai.google.dev/gemini-api/docs/pricing
    models:
      - {id: gemini-2.5-pro, kind: chat, price: {input_per_mtok: 1.25, output_per_mtok: 10}}
      - {id: gemini-2.5-flash, kind: chat, price: {input_per_mtok: 0.3, output_per_mtok: 2.5}}
      - {id: gemini-2.5-flash-lite, kind: chat, price: {input_per_mtok: 0.1, output_per_mtok: 0.4}}
      - {id: gemini-embedding-001, kind: embeddings, price: {input_per_mtok: 0.15}}
  - id: mistral
    name: Mistral AI
    type: openai
    base_url: https://api.mistral.ai/v1
    key_env: MISTRAL_API_KEY
    key_url: https://console.mistral.ai/api-keys
    pricing_url: https://mistral.ai/pricing#api-pricing
    models:
      - {id: mistral-large-latest, kind: chat, price: {input_per_mtok: 2, output_per_mtok: 6}}
      - {id: mistral-small-latest, kind: chat, price: {input_per_mtok: 0.1, output_per_mtok: 0.3}}
      - {id: codestral-latest, kind: chat, price: {input_per_mtok: 0.3, output_per_mtok: 0.9}}
      - {id: mistral-embed, kind: embeddings, price: {input_per_mtok: 0.1}}
  - id: groq
    name: Groq
    type: openai
    base_url: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY
    key_url: https://console.groq.com/keys
    pricing_url: https://groq.com/pricing
    models:
      - {id: llama-3.3-70b-versatile, kind: chat, price: {input_per_mtok: 0.59, output_per_mtok: 0.79}}
      - {id: llama-3.1-8b-instant, kind: chat, price: {input_per_mtok: 0.05, output_per_mtok: 0.08}}
      - {id: whisper-large-v3-turbo, kind: transcription, price: {per_audio_minute: 0.000667}}
  - id: deepseek
    name: DeepSeek
    type: openai
    base_url: https://api.deepseek.com/v1
    key_env: DEEPSEEK_API_KEY
    key_url: https://platform.deepseek.com/api_keys
    pricing_url: https://api-docs.deepseek.com/quick_start/pricing
    models:
      - {id: deepseek-chat, kind: chat, price: {input_per_mtok: 0.28, cached_input_per_mtok: 0.028, output_per_mtok: 0.42}}
      - {id: deepseek-reasoner, kind: chat, price: {input_per_mtok: 0.28, cached_input_per_mtok: 0.028, output_per_mtok: 0.42}}
  - id: openrouter
    name: OpenRouter
    type: openai
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    key_url: https://openrouter.ai/settings/keys
    pricing_url: https://openrouter.ai/models
    custom_models: true
    models: []
  - id: azure-openai
    name: Azure OpenAI
    type: openai
    base_url: https://YOUR-RESOURCE.openai.azure.com/openai/v1
    key_env: AZURE_OPENAI_API_KEY
    pricing_url: https://azure.microsoft.com/pricing/details/cognitive-services/openai-service/
    custom_models: true
    note: Replace YOUR-RESOURCE with your resource name, and add each deployment name as a model. If your resource refuses the key as a bearer token, send it in an api-key header instead.
    models: []
  - id: bedrock
    name: Amazon Bedrock
    type: bedrock
    region: us-east-1
    key_env: AWS_BEARER_TOKEN_BEDROCK
    pricing_url: https://aws.amazon.com/bedrock/pricing/
    key_optional: true
    note: Without an API key, requests are signed with the AWS default credential chain.
    custom_models: true
    models:
      - {id: amazon.nova-pro-v1:0, kind: chat, price: {input_per_mtok: 0.8, output_per_mtok: 3.2}}
      - {id: amazon.nova-lite-v1:0, kind: chat, price: {input_per_mtok: 0.06, output_per_mtok: 0.24}}
      - {id: amazon.titan-embed-text-v2:0, kind: embeddings, price: {input_per_mtok: 0.02}}
  - id: vertex
    name: Google Vertex AI
    type: vertex
    location: global
    no_key: true
    note: Uses Application Default Credentials or a credentials_file; set project to your Google Cloud project.
    pricing_url: https://cloud.google.com/vertex-ai/generative-ai/pricing
    custom_models: true
    models:
      - {id: gemini-2.5-pro, kind: chat, price: {input_per_mtok: 1.25, output_per_mtok: 10}}
      - {id: gemini-2.5-flash, kind: chat, price: {input_per_mtok: 0.3, output_per_mtok: 2.5}}
  - id: elevenlabs
    name: ElevenLabs
    type: elevenlabs
    base_url: https://api.elevenlabs.io
    key_env: ELEVENLABS_API_KEY
    key_url: https://elevenlabs.io/app/settings/api-keys
    pricing_url: https://elevenlabs.io/pricing/api
    note: Speech requests name an ElevenLabs voice ID as the voice.
    models:
      - {id: eleven_multilingual_v2, kind: speech, price: {per_mchars: 100}}
      - {id: eleven_flash_v2_5, kind: speech, price: {per_mchars: 50}}
      - {id: scribe_v1, kind: transcription, price: {per_audio_minute: 0.0067}}
  - id: deepgram
    name: Deepgram
    type: deepgram
    base_url: https://api.deepgram.com
    key_env: DEEPGRAM_API_KEY
    key_url: https://console.deepgram.com/
    pricing_url: https://deepgram.com/pricing
    note: Aura models name their voice, such as aura-2-thalia-en.
    models:
      - {id: nova-3, kind: transcription, price: {per_audio_minute: 0.0043}}
      - {id: aura-2-thalia-en, kind: speech, price: {per_mchars: 30}}
  - id: assemblyai
    name: AssemblyAI
    type: assemblyai
    base_url: https://api.assemblyai.com
    key_env: ASSEMBLYAI_API_KEY
    key_url: https://www.assemblyai.com/app/api-keys
    pricing_url: https://www.assemblyai.com/pricing
    note: Transcripts are deleted from AssemblyAI once the gateway has read them.
    models:
      - {id: universal, kind: transcription, price: {per_audio_minute: 0.0025}}
      - {id: slam-1, kind: transcription, price: {per_audio_minute: 0.0045}}
  - id: ollama
    name: Ollama (local)
    type: openai
    base_url: http://localhost:11434/v1
    key_optional: true
    custom_models: true
    models:
      - {id: llama3.2, kind: chat}
      - {id: nomic-embed-text, kind: embeddings}
  - id: vllm
    name: vLLM (self-hosted)
    type: openai
    base_url: http://localhost:8000/v1
    key_optional: true
    custom_models: true
    models: []
